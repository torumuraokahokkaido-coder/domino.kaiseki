<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドミノ運動解析アプリ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #f4f4f9; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .video-container { position: relative; width: 100%; max-width: 800px; margin: 10px auto; border: 1px solid #ccc; background: #000; }
        video, canvas { display: block; width: 100%; height: auto; }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; touch-action: none; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; align-items: center; justify-content: center;}
        button, input[type="file"], input[type="number"] { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; background: #fff;}
        button { cursor: pointer; background: #007bff; color: white; border: none; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        .panel { padding: 15px; background: #eef; border-radius: 5px; margin-bottom: 15px; }
        .chart-container { position: relative; width: 100%; height: 400px; margin-bottom: 30px; }
        .info-text { font-size: 12px; color: #555; margin-top: 5px; }
        .legend-btn { margin: 2px; padding: 4px 8px; font-size: 12px; background: #007bff; color: #fff; border: none; border-radius: 3px; cursor: pointer; }
        .legend-btn.off { background: #ccc; color: #333; }
        .edit-modes label { margin-right: 15px; cursor: pointer; font-weight: bold; }
        
        @media print {
            body { background: #fff; }
            .container { box-shadow: none; max-width: 100%; }
            .no-print { display: none !important; }
            .panel { background: #fff; border: 1px solid #ccc; }
            .chart-container { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="display: flex; justify-content: space-between; align-items: center;">
        ドミノ運動解析アプリ
        <div class="no-print">
            <button id="btnDownloadCSV" style="background:#17a2b8;">CSV保存</button>
            <button id="btnPrint" style="background:#6c757d;">ページ印刷</button>
        </div>
    </h2>
    
    <div class="panel no-print">
        <strong>1. 動画読み込みとキャリブレーション</strong><br>
        <input type="file" id="videoUpload" accept="video/*">
        <label style="margin-left: 10px;">動画FPS: <input type="number" id="fpsInput" value="30" style="width: 60px;"></label>
        <div style="margin-top:10px;">
            <button id="btnCalibrate">基準線を引く(ドラッグ)</button>
            <input type="number" id="actualLength" placeholder="実際の長さ(mm)" value="50" style="width: 120px;"> mm
            <span id="scaleInfo" style="margin-left: 10px; font-size: 14px; color: green; font-weight: bold;">スケール未設定</span>
        </div>
    </div>

    <div class="panel no-print">
        <strong>2. トラッキング設定 (赤い点の設定)</strong><br>
        <p class="info-text">
            ・自動検出後、下のラジオボタンを切り替えて点の追加・削除・微調整を行ってください。<br>
            ・追跡中に点がずれた場合は「一時停止」を押し、移動モードで点を正しい位置に直してから再開できます。
        </p>
        <div style="margin-top:10px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
            <button id="btnAutoDetect" style="background:#e83e8c;">赤い点を自動検出</button>
            <button id="btnClearPoints" style="background:#6c757d;">リセット</button>
            
            <div class="edit-modes" style="background: #fff; padding: 5px 15px; border-radius: 5px; border: 1px solid #ccc;">
                <strong>点の編集: </strong>
                <label><input type="radio" name="editMode" value="move" checked> 移動(ドラッグ)</label>
                <label><input type="radio" name="editMode" value="add"> 追加(タップ)</label>
                <label><input type="radio" name="editMode" value="delete"> 削除(タップ)</label>
            </div>
        </div>
        <div style="margin-top: 15px;">
            <button id="btnAnalyze" style="background:#ffc107; color:#000;">▶ 自動追跡を開始</button>
            <button id="btnPauseTrack" style="background:#dc3545; display:none;">⏸ 一時停止 (手動修正)</button>
            <button id="btnResumeTrack" style="background:#28a745; display:none;">▶ 追跡再開</button>
        </div>
    </div>

    <div class="controls no-print">
        <button id="btnPlay">再生 / 一時停止</button>
        <button id="btnSlow">スロー再生(0.5x)</button>
        <button id="btnPrevFrame">前フレーム</button>
        <button id="btnNextFrame">次フレーム</button>
        <span style="font-size: 14px; font-weight: bold;">時間: <span id="timeDisplay">0.000</span>s</span>
    </div>

    <div class="video-container" id="vidContainer">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="resultsPanel" class="panel" style="display:none;">
        <strong>解析結果（波の伝播速度）</strong>
        <p class="info-text">※最初のドミノが動き始めた時間を t=0 としています。</p>
        <p id="propagationSpeedText" style="line-height: 1.6; margin-bottom: 5px;"></p>
        <div id="maxSpeedInfo"></div>
    </div>

    <div class="chart-container">
        <canvas id="waveVelChart"></canvas>
    </div>

    <div id="customLegend" class="no-print" style="text-align: center; margin-bottom: 15px; display: none;">
        <strong>各ドミノの表示切替: </strong>
        <div id="legendButtons" style="display:inline-block; margin-left: 10px;"></div>
    </div>

    <div class="chart-container">
        <canvas id="velChart"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="dispChart"></canvas>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let scaleRatio = 1; 
    let mode = 'set_points'; // デフォルトで点編集モード
    let trackingPaused = false; 
    
    let calibStart = null;
    let calibEnd = null;
    let isDragging = false;
    let draggedPoint = null; 

    let trackers = []; 
    let dispChart, velChart, waveVelChart;
    let analysisDataReady = false; 
    let waveData = []; 

    // --- イベントリスナー設定 ---
    document.getElementById('videoUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        video.src = URL.createObjectURL(file);
        video.load();
        trackers = [];
        drawOverlay();
    });

    video.addEventListener('loadeddata', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        drawOverlay();
    });

    video.addEventListener('timeupdate', () => {
        document.getElementById('timeDisplay').innerText = video.currentTime.toFixed(3);
        if(mode !== 'tracking') drawOverlay();
    });

    document.getElementById('btnPlay').onclick = () => video.paused ? video.play() : video.pause();
    document.getElementById('btnSlow').onclick = () => { video.playbackRate = video.playbackRate === 1.0 ? 0.5 : 1.0; };
    function getFPS() { return parseFloat(document.getElementById('fpsInput').value) || 30; }
    document.getElementById('btnPrevFrame').onclick = () => { video.currentTime = Math.max(0, video.currentTime - 1/getFPS()); };
    document.getElementById('btnNextFrame').onclick = () => { video.currentTime = Math.min(video.duration, video.currentTime + 1/getFPS()); };
    document.getElementById('btnPrint').onclick = () => window.print();

    document.getElementById('btnCalibrate').onclick = () => { mode = 'calibrate'; calibStart = null; calibEnd = null; alert("画面をドラッグして基準線を引いてください。"); };
    document.getElementById('btnClearPoints').onclick = () => { trackers = []; drawOverlay(); };

    // --- 赤い点の自動検出 ---
    document.getElementById('btnAutoDetect').onclick = () => {
        if(!video.videoWidth) return alert("動画を読み込んでください");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        let redPixels = [];
        for(let y=0; y<canvas.height; y+=2) {
            for(let x=0; x<canvas.width; x+=2) {
                let idx = (y*canvas.width + x) * 4;
                let r = frameData.data[idx];
                let g = frameData.data[idx+1];
                let b = frameData.data[idx+2];
                // 赤色の判定
                if(r > 150 && g < 100 && b < 100 && (r > g * 1.5)) {
                    redPixels.push({x, y});
                }
            }
        }

        let clusters = [];
        const distThreshold = 30; 
        for(let p of redPixels) {
            let found = false;
            for(let c of clusters) {
                if(Math.hypot(c.cx - p.x, c.cy - p.y) < distThreshold) {
                    c.points.push(p);
                    c.cx = (c.cx * (c.points.length-1) + p.x) / c.points.length; 
                    c.cy = (c.cy * (c.points.length-1) + p.y) / c.points.length;
                    found = true;
                    break;
                }
            }
            if(!found) clusters.push({cx: p.x, cy: p.y, points: [p]});
        }
        
        trackers = clusters.map(c => ({
            x: c.cx, y: c.cy, initial: {x: c.cx, y: c.cy}, history: []
        }));
        sortAndReassignIDs(); // 左から右に番号を振る
        
        mode = 'set_points'; 
        alert(trackers.length + " 個の赤い点を検出しました。\n足りない点や不要な点があれば「追加」「削除」モードで修正してください。");
    };

    function sortAndReassignIDs() {
        trackers.sort((a,b) => a.x - b.x);
        trackers.forEach((t, i) => t.id = i + 1);
        drawOverlay();
    }

    // --- タッチ＆マウスイベント (追加・削除・移動) ---
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    canvas.addEventListener('mousedown', pointerDown);
    canvas.addEventListener('touchstart', (e) => { if(e.touches.length === 1) { e.preventDefault(); pointerDown(e); } }, {passive: false});
    canvas.addEventListener('mousemove', pointerMove);
    canvas.addEventListener('touchmove', (e) => { if(isDragging || draggedPoint) { e.preventDefault(); pointerMove(e); } }, {passive: false});
    window.addEventListener('mouseup', pointerUp);
    window.addEventListener('touchend', pointerUp);

    function pointerDown(e) {
        const pos = getPointerPos(e);
        if(mode === 'calibrate') {
            isDragging = true; calibStart = pos; calibEnd = pos;
        } else if(mode === 'set_points') {
            const editMode = document.querySelector('input[name="editMode"]:checked').value;
            
            // クリックした位置に最も近い点を探す (半径20px以内)
            let clickedExistingIdx = -1;
            let minDist = 20;
            trackers.forEach((p, idx) => {
                let d = Math.hypot(p.x - pos.x, p.y - pos.y);
                if(d < minDist) { minDist = d; clickedExistingIdx = idx; }
            });

            if (editMode === 'delete') {
                if(clickedExistingIdx !== -1) {
                    trackers.splice(clickedExistingIdx, 1);
                    sortAndReassignIDs();
                }
            } else if (editMode === 'add') {
                trackers.push({ x: pos.x, y: pos.y, initial: {x: pos.x, y: pos.y}, history: [] });
                sortAndReassignIDs();
            } else if (editMode === 'move') {
                if(clickedExistingIdx !== -1) draggedPoint = trackers[clickedExistingIdx];
            }
        }
    }

    function pointerMove(e) {
        const pos = getPointerPos(e);
        if(mode === 'calibrate' && isDragging) {
            calibEnd = pos; drawOverlay();
        } else if(draggedPoint) {
            draggedPoint.x = pos.x; draggedPoint.y = pos.y;
            // 追跡前なら初期位置も更新
            if(!analysisDataReady && draggedPoint.history.length === 0) {
                draggedPoint.initial = {x: pos.x, y: pos.y};
            }
            drawOverlay();
        }
    }

    function pointerUp(e) {
        if(mode === 'calibrate' && isDragging) {
            isDragging = false;
            const pxDistance = Math.hypot(calibEnd.x - calibStart.x, calibEnd.y - calibStart.y);
            const actualMm = parseFloat(document.getElementById('actualLength').value) || 50;
            if(pxDistance > 0) {
                scaleRatio = actualMm / pxDistance;
                document.getElementById('scaleInfo').innerText = `1px = ${scaleRatio.toFixed(2)}mm`;
            }
            mode = 'set_points';
        }
        if(draggedPoint) {
            draggedPoint = null;
            sortAndReassignIDs(); // 移動後に順番が入れ替わった場合の対応
        }
    }

    function drawOverlay() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if(calibStart && calibEnd) {
            ctx.beginPath(); ctx.moveTo(calibStart.x, calibStart.y); ctx.lineTo(calibEnd.x, calibEnd.y);
            ctx.strokeStyle = 'cyan'; ctx.lineWidth = 3; ctx.stroke();
        }
        trackers.forEach(t => {
            ctx.beginPath(); ctx.arc(t.x, t.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = 'lime'; ctx.fill(); ctx.strokeStyle = 'black'; ctx.stroke();
            ctx.fillStyle = 'white'; ctx.font = "bold 16px Arial";
            ctx.fillText(t.id, t.x + 10, t.y - 10);
        });
    }

    // --- 自動追跡の開始・一時停止・再開 ---
    document.getElementById('btnAnalyze').onclick = () => {
        if(trackers.length === 0) return alert("トラッキングポイントを設定してください");
        
        mode = 'tracking'; 
        analysisDataReady = false;
        trackingPaused = false;
        
        document.getElementById('btnAnalyze').style.display = 'none';
        document.getElementById('btnPauseTrack').style.display = 'inline-block';
        document.getElementById('btnResumeTrack').style.display = 'none';
        
        video.pause(); video.currentTime = 0; 
        trackers.forEach(t => { t.history = []; t.x = t.initial.x; t.y = t.initial.y; });
        setTimeout(processFrame, 500);
    };

    document.getElementById('btnPauseTrack').onclick = () => {
        trackingPaused = true;
        mode = 'set_points'; // ドラッグ可能なモードに変更
        document.querySelector('input[name="editMode"][value="move"]').checked = true; // 強制的に移動モード
        document.getElementById('btnPauseTrack').style.display = 'none';
        document.getElementById('btnResumeTrack').style.display = 'inline-block';
        alert("追跡を一時停止しました。\nずれた点をドラッグして正しい位置に修正し、「追跡再開」を押してください。");
    };

    document.getElementById('btnResumeTrack').onclick = () => {
        trackingPaused = false;
        mode = 'tracking';
        document.getElementById('btnResumeTrack').style.display = 'none';
        document.getElementById('btnPauseTrack').style.display = 'inline-block';
        processFrame(); // ループ再開
    };

    // --- ★修正：速度予測トラッキング処理本体 ---
    function processFrame() {
        if(trackingPaused) return; 
        
        if(video.currentTime >= video.duration || (video.paused && mode !== 'tracking')) {
            finishAnalysis(); return;
        }
        
        const t = video.currentTime;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        let allRedPixels = [];
        // 探索半径を広げて高速移動に対応 (30px)
        const searchRadius = 30; 

        for(let y=0; y<canvas.height; y+=2) {
            for(let x=0; x<canvas.width; x+=2) {
                let r = frameData.data[(y * canvas.width + x) * 4];
                let g = frameData.data[(y * canvas.width + x) * 4 + 1];
                let b = frameData.data[(y * canvas.width + x) * 4 + 2];
                if(r > 150 && g < 100 && b < 100 && (r > g * 1.5)) {
                    allRedPixels.push({x, y});
                }
            }
        }

        // 各点の「次のフレームの予測位置」を計算
        trackers.forEach(trk => {
            trk.predicted_x = trk.x;
            trk.predicted_y = trk.y;
            // 履歴が2つ以上あれば、直前の速度ベクトルを加算して予測
            if(trk.history.length >= 2) {
                let p1 = trk.history[trk.history.length - 1];
                let p2 = trk.history[trk.history.length - 2];
                trk.predicted_x = trk.x + (p1.x - p2.x);
                trk.predicted_y = trk.y + (p1.y - p2.y);
            }
        });

        // 予測位置を基準に、最も近い点に赤ピクセルを排他割り当て
        let trackerPixels = trackers.map(() => []);
        allRedPixels.forEach(p => {
            let minDist = searchRadius;
            let closestTrackerIdx = -1;
            trackers.forEach((trk, i) => {
                let dist = Math.hypot(trk.predicted_x - p.x, trk.predicted_y - p.y);
                if(dist < minDist) {
                    minDist = dist;
                    closestTrackerIdx = i;
                }
            });
            if(closestTrackerIdx !== -1) {
                trackerPixels[closestTrackerIdx].push(p);
            }
        });

        // 重心を更新
        trackers.forEach((trk, i) => {
            let pixels = trackerPixels[i];
            if(pixels.length > 0) {
                let sumX = 0, sumY = 0;
                pixels.forEach(p => { sumX += p.x; sumY += p.y; });
                trk.x = sumX / pixels.length;
                trk.y = sumY / pixels.length;
            } else {
                // ピクセルが見つからない場合は予測位置を採用して見失いを防ぐ
                trk.x = trk.predicted_x;
                trk.y = trk.predicted_y;
            }

            const dispX = (trk.x - trk.initial.x) * scaleRatio;
            const dispY = (trk.y - trk.initial.y) * scaleRatio;
            const totalDisp = Math.hypot(dispX, dispY);

            let v = 0;
            if(trk.history.length > 0) {
                const prev = trk.history[trk.history.length - 1];
                const dt = t - prev.original_t;
                if(dt > 0) v = (totalDisp - prev.disp) / dt;
            }

            trk.history.push({ original_t: t, shifted_t: t, x: trk.x, y: trk.y, disp: totalDisp, v });
        });

        drawOverlay();

        const fps = getFPS();
        if(video.currentTime + 1/fps < video.duration) {
            video.currentTime += 1/fps;
            video.addEventListener('seeked', function onSeeked() {
                video.removeEventListener('seeked', onSeeked);
                if(!trackingPaused) processFrame();
            });
        } else {
            finishAnalysis();
        }
    }

    function finishAnalysis() {
        mode = 'set_points'; 
        analysisDataReady = true;
        document.getElementById('btnAnalyze').style.display = 'inline-block';
        document.getElementById('btnPauseTrack').style.display = 'none';
        document.getElementById('btnResumeTrack').style.display = 'none';
        
        alert("解析完了！グラフと伝播速度を表示します。");
        calculatePropagationAndShiftTime();
        drawGraphs();
        buildCustomLegend();
    }

    function calculatePropagationAndShiftTime() {
        const thresholdV = 10; 
        let startTimes = [];
        let globalStartTime = null;
        waveData = []; 
        
        trackers.forEach(trk => {
            const startPoint = trk.history.find(h => Math.abs(h.v) > thresholdV);
            if(startPoint) {
                startTimes.push({ id: trk.id, t: startPoint.original_t, x: trk.initial.x, y: trk.initial.y });
            }
        });

        if(startTimes.length > 0) {
            globalStartTime = Math.min(...startTimes.map(s => s.t));
            trackers.forEach(trk => {
                trk.history.forEach(h => { h.shifted_t = h.original_t - globalStartTime; });
            });
        }

        if(startTimes.length >= 2) {
            startTimes.sort((a,b) => a.id - b.id);
            let text = "";
            let totalSpeed = 0;
            let validCount = 0;
            
            for(let i = 0; i < startTimes.length - 1; i++) {
                let dt = startTimes[i+1].t - startTimes[i].t;
                let dpX = (startTimes[i+1].x - startTimes[i].x) * scaleRatio;
                let dpY = (startTimes[i+1].y - startTimes[i].y) * scaleRatio;
                let distance = Math.hypot(dpX, dpY);
                if(dt > 0) {
                    let speed = distance / dt;
                    totalSpeed += speed;
                    validCount++;
                    let shiftedT = startTimes[i].t - globalStartTime;
                    waveData.push({ x: shiftedT, y: speed, label: `D${startTimes[i].id}→D${startTimes[i+1].id}` });
                    
                    text += `[${startTimes[i].id} → ${startTimes[i+1].id}] 遅延: ${dt.toFixed(3)} s, 距離: ${distance.toFixed(1)} mm, 速度: <span style="color:#e83e8c;">${speed.toFixed(1)} mm/s</span><br>`;
                }
            }
            if(validCount > 0) {
                text += `<br><strong>平均波速度: ${(totalSpeed/validCount).toFixed(1)} mm/s</strong>`;
            }
            
            document.getElementById('resultsPanel').style.display = 'block';
            document.getElementById('propagationSpeedText').innerHTML = text;

            if(waveData.length > 0) {
                let maxData = waveData.reduce((prev, current) => (prev.y > current.y) ? prev : current);
                document.getElementById('maxSpeedInfo').innerHTML = `<strong style="color:#d9534f; font-size: 16px;">🏆 最高伝播速度: ${maxData.y.toFixed(1)} mm/s (到達時間: ${maxData.x.toFixed(3)} s)</strong>`;
            }
        }
    }

    function drawGraphs() {
        if(dispChart) dispChart.destroy();
        if(velChart) velChart.destroy();
        if(waveVelChart) waveVelChart.destroy();

        const colors = ['#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#fabed4', '#469990', '#dcbeff', '#9A6324', '#fffac8', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075', '#a9a9a9'];

        const commonOptions = {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'nearest', axis: 'x', intersect: false },
            scales: { x: { type: 'linear', title: { display: true, text: '時間 (s) ※動き始めを0とする' } } }
        };

        const ctxWave = document.getElementById('waveVelChart').getContext('2d');
        waveVelChart = new Chart(ctxWave, {
            type: 'line',
            data: {
                datasets: [{
                    label: '波の伝播速度',
                    data: waveData,
                    borderColor: '#e83e8c',
                    backgroundColor: 'rgba(232, 62, 140, 0.2)',
                    tension: 0.4, 
                    fill: true,
                    pointRadius: 4,
                    borderWidth: 3
                }]
            },
            options: { 
                ...commonOptions, 
                plugins: { 
                    title: { display: true, text: '波全体の伝播速度 - 時間グラフ', font:{size: 16} },
                    tooltip: { callbacks: { label: function(context) { return context.raw.label + " : " + context.raw.y.toFixed(2) + " mm/s"; } } }
                }, 
                scales: { ...commonOptions.scales, y: { title: { display: true, text: '波の速度 (mm/s)' } } } 
            }
        });

        let dispDatasets = trackers.map((trk, i) => ({
            label: `ドミノ ${trk.id}`,
            data: trk.history.map(h => ({ x: h.shifted_t, y: h.disp })),
            borderColor: colors[i % colors.length], fill: false, pointRadius: 0, borderWidth: 2, tension: 0.1
        }));

        let velDatasets = trackers.map((trk, i) => ({
            label: `ドミノ ${trk.id}`,
            data: trk.history.map(h => ({ x: h.shifted_t, y: h.v })),
            borderColor: colors[i % colors.length], fill: false, pointRadius: 0, borderWidth: 2, tension: 0.1
        }));

        const ctxVel = document.getElementById('velChart').getContext('2d');
        velChart = new Chart(ctxVel, {
            type: 'line', data: { datasets: velDatasets },
            options: { ...commonOptions, plugins: { title: { display: true, text: '各ドミノの速度 - 時間グラフ', font:{size: 16} }, legend: { display: false } }, scales: { ...commonOptions.scales, y: { title: { display: true, text: '速度 (mm/s)' } } } }
        });

        const ctxDisp = document.getElementById('dispChart').getContext('2d');
        dispChart = new Chart(ctxDisp, {
            type: 'line', data: { datasets: dispDatasets },
            options: { ...commonOptions, plugins: { title: { display: true, text: '各ドミノの変位 - 時間グラフ', font:{size: 16} }, legend: { display: false } }, scales: { ...commonOptions.scales, y: { title: { display: true, text: '変位 (mm)' } } } }
        });
    }

    function buildCustomLegend() {
        const legendContainer = document.getElementById('customLegend');
        const btnContainer = document.getElementById('legendButtons');
        legendContainer.style.display = 'block';
        btnContainer.innerHTML = '';

        trackers.forEach((trk, i) => {
            const btn = document.createElement('button');
            btn.className = 'legend-btn';
            btn.innerText = `D${trk.id}`;
            btn.onclick = () => {
                const isHidden = dispChart.data.datasets[i].hidden;
                dispChart.data.datasets[i].hidden = !isHidden;
                velChart.data.datasets[i].hidden = !isHidden;
                dispChart.update();
                velChart.update();
                if(!isHidden) {
                    btn.classList.add('off');
                } else {
                    btn.classList.remove('off');
                }
            };
            btnContainer.appendChild(btn);
        });
    }

    document.getElementById('btnDownloadCSV').onclick = () => {
        if(!analysisDataReady) return alert("先に解析を実行してください。");
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        let header = ["Shifted Time(s)", "Original Time(s)"];
        trackers.forEach(t => { header.push(`D${t.id}_Disp(mm)`); header.push(`D${t.id}_Vel(mm/s)`); });
        csvContent += header.join(",") + "\r\n";

        const frameCount = trackers[0].history.length;
        for(let i=0; i<frameCount; i++) {
            let row = [ trackers[0].history[i].shifted_t.toFixed(4), trackers[0].history[i].original_t.toFixed(4) ];
            trackers.forEach(t => {
                let h = t.history[i];
                row.push(h ? h.disp.toFixed(2) : ""); row.push(h ? h.v.toFixed(2) : "");
            });
            csvContent += row.join(",") + "\r\n";
        }
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "domino_analysis_data.csv");
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };
</script>
</body>
</html>
